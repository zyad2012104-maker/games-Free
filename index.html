<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع الألعاب المجانية</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f3f3;
display:flex;
}

/* عمود الاعلانات */

.left-ads{
width:180px;
background:#e5e5e5;
padding-top:20px;
display:flex;
flex-direction:column;
align-items:center;
}

.ad-box{
width:160px;
height:600px;
background:#ccc;
margin-bottom:20px;
display:flex;
justify-content:center;
align-items:center;
}

/* المحتوى */

.main{
flex:1;
text-align:center;
}

/* اعلان اعلى */

.ad-top{
width:100%;
height:90px;
background:#ddd;
display:flex;
justify-content:center;
align-items:center;
font-size:18px;
}

/* اعلان اسفل */

.ad-bottom{
width:100%;
height:90px;
background:#ddd;
display:flex;
justify-content:center;
align-items:center;
margin-top:20px;
}

/* العنوان */

header{
background:#222;
color:white;
padding:20px;
}

/* الوقت */

.info{
margin:10px;
font-size:16px;
}

/* شبكة الألعاب */

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
padding:30px;
}

/* بطاقة اللعبة */

.game-card{
background:white;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
padding:10px;
}

/* صورة اللعبة */

.game-card img{
width:100%;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.game-card img:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<!-- اعلانات يسار -->

<div class="left-ads">

<div class="ad-box">
اعلان 160×600
</div>

<div class="ad-box">
اعلان 160×600
</div>

</div>

<div class="main">

<!-- اعلان اعلى -->

<div class="ad-top">
اعلان 728×90
</div>

<header>
<h1>🎮 موقع الألعاب المجانية</h1>
</header>

<div class="info">

عدد الزيارات: <span id="visits"></span> |
<span id="date"></span> |
<span id="clock"></span>

</div>

<!-- الألعاب -->

<div class="games">

<div class="game-card">
<a href="games/xo/index.html">
<img src="images/xo.jpg">
</a>
</div>

<div class="game-card">
<a href="games/snake/index.html">
<img src="images/snake.jpg">
</a>
</div>

<div class="game-card">
<a href="games/memory/index.html">
<img src="images/memory.jpg">
</a>
</div>

<div class="game-card">
<a href="games/puzzle/index.html">
<img src="images/puzzle.jpg">
</a>
</div>

</div>

<!-- اعلان اسفل -->

<div class="ad-bottom">
اعلان 728×90
</div>

</div>

<script>

/* عداد الزيارات */

let visits = localStorage.getItem("visits");

if(visits==null){
visits=1;
}else{
visits++;
}

localStorage.setItem("visits",visits);
document.getElementById("visits").innerText=visits;

/* التاريخ */

let today = new Date();

document.getElementById("date").innerHTML =
today.toLocaleDateString('ar-EG',{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
});

/* الساعة */

function updateClock(){

let now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString();

}

setInterval(updateClock,1000);

</script>

</body>
</html>
