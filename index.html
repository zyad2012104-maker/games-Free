<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الألعاب المجانية</title>
    
    <!-- سكربت AdSense - مرة واحدة فقط في الصفحة -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8584077826935053" crossorigin="anonymous"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: row;
        }

        /* الإعلانات الجانبية - للكمبيوتر فقط */
        .left-ads {
            width: 180px;
            background: #e5e5e5;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .ad-box {
            width: 160px;
            min-height: 600px;
            background: #f9f9f9;
            border-radius: 8px;
            overflow: hidden;
        }

        /* المحتوى الرئيسي */
        .main {
            flex: 1;
            min-width: 0;
        }

        /* الإعلانات العلوية والسفلية */
        .ad-top, .ad-bottom {
            width: 100%;
            min-height: 100px;
            background: #f9f9f9;
            margin: 10px 0;
            overflow: hidden;
            border-radius: 8px;
        }

        /* الهيدر */
        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin: 10px;
        }

        header h1 {
            font-size: 28px;
        }

        /* إحصائيات الموقع */
        .stats {
            background: white;
            padding: 20px;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-item {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 25px;
            border-right: 4px solid #ff9800;
            font-size: 16px;
        }

        .stat-label {
            font-weight: bold;
            color: #ff9800;
            margin-left: 8px;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
        }

        /* شبكة الألعاب */
        .games {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        /* إعلانات الموبيل بين الألعاب */
        .mobile-ad {
            display: none;
            width: 100%;
            min-height: 120px;
            background: #f9f9f9;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }

        /* ========== تنسيقات الموبيل ========== */
        @media screen and (max-width: 768px) {
            body {
                flex-direction: column;
            }
            
            .left-ads {
                display: none;
            }
            
            .mobile-ad {
                display: block;
            }
            
            .games {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 10px;
            }
            
            header h1 {
                font-size: 22px;
            }
            
            .stats {
                gap: 10px;
                padding: 15px;
            }
            
            .stat-item {
                padding: 8px 15px;
                font-size: 14px;
            }
        }
        
        @media screen and (max-width: 480px) {
            .stat-item {
                width: calc(50% - 10px);
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- الإعلانات الجانبية (للكمبيوتر فقط) -->
    <div class="left-ads">
        <!-- إعلان جانبي 1 - 8096225516 -->
        <div class="ad-box">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-8584077826935053"
                 data-ad-slot="8096225516"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
        
        <!-- إعلان جانبي 2 - 9040442410 -->
        <div class="ad-box">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-8584077826935053"
                 data-ad-slot="9040442410"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main">
        
        <!-- إعلان أعلى الموقع - 2904141418 -->
        <div class="ad-top">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-8584077826935053"
                 data-ad-slot="2904141418"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- الهيدر -->
        <header>
            <h1>🎮 موقع الألعاب المجانية</h1>
        </header>

        <!-- إحصائيات الموقع -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">📅 تاريخ الإنشاء:</span>
                <span class="stat-value" id="creationDate">15 يناير 2024</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">👥 إجمالي الزيارات:</span>
                <span class="stat-value" id="totalVisits">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">📆 زيارات الشهر:</span>
                <span class="stat-value" id="monthVisits">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">📅 زيارات اليوم:</span>
                <span class="stat-value" id="dayVisits">0</span>
            </div>
        </div>

        <!-- الألعاب مع إعلانات بينية للموبيل -->
        <div class="games">
            <!-- اللعبة 1 -->
            <div class="game-card">
                <a href="games/xo/index.html">
                    <img src="images/xo.jpg" alt="XO">
                </a>
            </div>
            
            <!-- إعلان موبيل 1 -->
            <div class="mobile-ad">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-8584077826935053"
                     data-ad-slot="8096225516"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
            
            <!-- اللعبة 2 -->
            <div class="game-card">
                <a href="games/snake/index.html">
                    <img src="images/snake.jpg" alt="Snake">
                </a>
            </div>
            
            <!-- اللعبة 3 -->
            <div class="game-card">
                <a href="games/memory/index.html">
                    <img src="images/memory.jpg" alt="Memory">
                </a>
            </div>
            
            <!-- إعلان موبيل 2 -->
            <div class="mobile-ad">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="autorelaxed"
                     data-ad-client="ca-pub-8584077826935053"
                     data-ad-slot="9040442410"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
            
            <!-- اللعبة 4 -->
            <div class="game-card">
                <a href="games/puzzle/index.html">
                    <img src="images/puzzle.jpg" alt="Puzzle">
                </a>
            </div>
        </div>

        <!-- إعلان أسفل الموقع - 3136510471 -->
        <div class="ad-bottom">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-8584077826935053"
                 data-ad-slot="3136510471"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </div>

    <script>
        // كود إحصائيات الزوار - بسيط ونظيف
        (function() {
            try {
                const now = new Date();
                const today = now.toDateString();
                const month = now.getMonth() + '-' + now.getFullYear();
                
                // قراءة الإحصائيات
                let stats = JSON.parse(localStorage.getItem('site_stats')) || {
                    total: 0,
                    daily: {},
                    monthly: {}
                };
                
                // تحديث الأرقام
                stats.total++;
                stats.daily[today] = (stats.daily[today] || 0) + 1;
                stats.monthly[month] = (stats.monthly[month] || 0) + 1;
                
                // حفظ
                localStorage.setItem('site_stats', JSON.stringify(stats));
                
                // عرض الأرقام
                document.getElementById('totalVisits').textContent = stats.total;
                document.getElementById('dayVisits').textContent = stats.daily[today] || 0;
                document.getElementById('monthVisits').textContent = stats.monthly[month] || 0;
                document.getElementById('creationDate').textContent = '15 يناير 2024';
                
            } catch(e) {
                console.log('خطأ في الإحصائيات:', e);
            }
        })();
    </script>
    
    <!-- لا يوجد أي كود إضافي للإعلانات هنا -->
</body>
</html>
