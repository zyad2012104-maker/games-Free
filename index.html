<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الألعاب المجانية</title>
    
    <!-- ✅ رمز AdSense التابع لك - مرة واحدة فقط في الصفحة -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8584077826935053" crossorigin="anonymous"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: row;
        }

        /* الإعلانات الجانبية - للكمبيوتر فقط */
        .left-ads {
            width: 180px;
            background: #e5e5e5;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .ad-box {
            width: 160px;
            min-height: 600px;
            background: #f9f9f9;
            border-radius: 8px;
            overflow: hidden;
        }

        /* المحتوى الرئيسي */
        .main {
            flex: 1;
            min-width: 0;
        }

        /* الإعلانات العلوية والسفلية */
        .ad-top, .ad-bottom {
            width: 100%;
            min-height: 100px;
            background: #f9f9f9;
            margin: 10px 0;
            overflow: hidden;
            border-radius: 8px;
        }

        /* الهيدر */
        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin: 10px;
        }

        header h1 {
            font-size: 28px;
        }

        /* إحصائيات الموقع - تصميم متطور */
        .stats {
            background: white;
            padding: 25px;
            margin: 15px;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 2px solid #ff9800;
            position: relative;
            overflow: hidden;
        }

        .stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9800, #ff5722, #ff9800);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .stat-item {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 15px 25px;
            border-radius: 50px;
            border-right: 5px solid #ff9800;
            font-size: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            min-width: 200px;
            text-align: center;
        }

        .stat-item:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,152,0,0.3);
        }

        .stat-label {
            font-weight: bold;
            color: #ff9800;
            margin-left: 10px;
            font-size: 16px;
            display: block;
            margin-bottom: 5px;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
            font-size: 24px;
            display: block;
            animation: countUp 0.5s ease-out;
        }

        @keyframes countUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* تصميم خاص لرقم الزائر */
        .visitor-number {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white !important;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 5px 20px rgba(255,87,34,0.4);
        }

        .visitor-number .stat-label {
            color: white;
            opacity: 0.9;
        }

        .visitor-number .stat-value {
            color: white;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* وقت الزيارة */
        .visit-time {
            background: #333;
            color: white;
        }

        .visit-time .stat-label {
            color: #ff9800;
        }

        .visit-time .stat-value {
            color: #ff9800;
            font-family: monospace;
            font-size: 22px;
            letter-spacing: 2px;
        }

        /* شبكة الألعاب */
        .games {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        /* إعلانات الموبيل بين الألعاب */
        .mobile-ad {
            display: none;
            width: 100%;
            min-height: 120px;
            background: #f9f9f9;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }

        /* ========== تنسيقات الموبيل ========== */
        @media screen and (max-width: 768px) {
            body {
                flex-direction: column;
            }
            
            .left-ads {
                display: none;
            }
            
            .mobile-ad {
                display: block;
            }
            
            .games {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 10px;
            }
            
            header h1 {
                font-size: 22px;
            }
            
            .stats {
                padding: 15px;
                gap: 15px;
                margin: 10px;
            }
            
            .stat-item {
                padding: 12px 20px;
                min-width: 160px;
            }
            
            .stat-value {
                font-size: 20px;
            }
            
            .visitor-number .stat-value {
                font-size: 24px;
            }
        }
        
        @media screen and (max-width: 480px) {
            .stat-item {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- المحتوى الرئيسي -->
    <div class="main">

        <div class="stats">

    <script>
        // ========== عداد الزيارات المتطور ==========
        (function() {
            try {
                // الرقم الأساسي 2,500,500
                const BASE_NUMBER = 2500500;
                const STORAGE_KEY = 'advanced_visitor_counter';
                
                // استرجاع البيانات المحفوظة
                let counterData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
                    totalVisits: BASE_NUMBER,
                    lastVisitorNumber: BASE_NUMBER,
                    firstVisit: true
                };
                
                // إذا كانت أول زيارة
                if (counterData.firstVisit) {
                    counterData.totalVisits = BASE_NUMBER;
                    counterData.lastVisitorNumber = BASE_NUMBER;
                    counterData.firstVisit = false;
                }
                
                // زيادة العدد بمقدار 10
                counterData.totalVisits += 10;
                
                // حساب رقم الزائر الحالي (إجمالي الزيارات - 9)
                const currentVisitor = counterData.totalVisits - 9;
                
                // حفظ البيانات
                localStorage.setItem(STORAGE_KEY, JSON.stringify(counterData));
                
                // دالة تنسيق الأرقام
                function formatNumber(number) {
                    return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                }
                
                // عرض الأرقام
                document.getElementById('totalVisits').textContent = formatNumber(counterData.totalVisits);
                document.getElementById('visitorNumber').textContent = formatNumber(currentVisitor);
                document.getElementById('creationDate').textContent = '15 يناير 2024';
                
                // ========== عرض الوقت ==========
                function updateTime() {
                    const now = new Date();
                    const hours = now.getHours().toString().padStart(2, '0');
                    const minutes = now.getMinutes().toString().padStart(2, '0');
                    const seconds = now.getSeconds().toString().padStart(2, '0');
                    document.getElementById('visitTime').textContent = `${hours}:${minutes}:${seconds}`;
                }
                
                updateTime();
                setInterval(updateTime, 1000);
                
                // تأثير حركي
                const totalElement = document.getElementById('totalVisits');
                const visitorElement = document.getElementById('visitorNumber');
                
                totalElement.style.animation = 'none';
                visitorElement.style.animation = 'none';
                
                setTimeout(() => {
                    totalElement.style.animation = 'countUp 0.5s ease-out';
                    visitorElement.style.animation = 'countUp 0.5s ease-out';
                }, 100);
                
                // عرض في الكونسول
                console.log('✅ تم تحميل AdSense بنجاح');
                console.log('📊 إجمالي الزيارات:', formatNumber(counterData.totalVisits));
                console.log('👤 أنت الزائر رقم:', formatNumber(currentVisitor));
                
            } catch(e) {
                console.log('خطأ:', e);
            }
        })();
    </script>
