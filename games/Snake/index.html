    <script async custom-element="amp-auto-ads" src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        /* تخطيط الصفحة */
        .page-wrapper {
            display: flex;
            max-width: 1400px;
            width: 100%;
            gap: 15px;
        }
        
        /* الإعلان الجانبي الأيسر - يظهر فقط في الكمبيوتر */
        .sidebar-ad {
            width: 160px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: fit-content;
        }
        
        .ad-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .ad-space {
            width: 100%;
            min-height: 600px;
            background: transparent;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* الإعلان العلوي والسفلي */
        .top-ad, .bottom-ad {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .horizontal-ad {
            width: 100%;
            min-height: 90px;
            background: transparent;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* حاوية اللعبة */
        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            color: #00fff9;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: rgba(0, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            color: #00fff9;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            position: relative;
        }
        
        canvas {
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            background: #0a0a0f;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1/1;
            cursor: pointer;
            touch-action: none;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        button {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00fff9;
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            min-width: 120px;
        }
        
        button:hover, button:active {
            background: rgba(0, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.3);
        }
        
        /* أزرار التحكم للموبايل */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 280px;
            margin: 20px auto 0;
            padding: 15px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }
        
        .mobile-btn {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00fff9;
            padding: 20px;
            font-size: 2em;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            user-select: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            transition: all 0.1s ease;
        }
        
        .mobile-btn:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.95);
        }
        
        /* نافذة انتهاء اللعبة */
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            color: white;
            display: none;
            z-index: 1000;
            border: 2px solid #00fff9;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            min-width: 300px;
        }
        
        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ff3366;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }
        
        .game-over p {
            font-size: 1.3em;
            margin-bottom: 30px;
            color: #00fff9;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 999;
            backdrop-filter: blur(5px);
        }
        
        .instructions {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .adsbygoogle {
            background: transparent;
        }
        
        /* ========== تحسينات للموبايل ========== */
        @media (max-width: 900px) {
            .page-wrapper {
                flex-direction: column;
            }
            
            .sidebar-ad {
                display: none;
            }
            
            .main-content {
                width: 100%;
            }
            
            canvas {
                max-width: 100%;
                height: auto;
            }
            
            .mobile-controls {
                max-width: 100%;
                padding: 10px;
            }
            
            .mobile-btn {
                padding: 18px;
                font-size: 1.8em;
            }
            
            .stats {
                gap: 10px;
            }
            
            .stat-box {
                padding: 8px 15px;
                font-size: 1em;
                min-width: 100px;
            }
            
            .controls button {
                padding: 12px 20px;
                min-width: 120px;
                font-size: 1em;
            }
            
            .top-ad, .bottom-ad {
                padding: 8px;
            }
            
            .horizontal-ad {
                min-height: 80px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .game-container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .stats {
                gap: 8px;
            }
            
            .stat-box {
                padding: 6px 12px;
                font-size: 0.9em;
                min-width: 80px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .controls button {
                padding: 10px 15px;
                min-width: 100px;
                font-size: 0.9em;
            }
            
            .mobile-controls {
                gap: 8px;
                padding: 8px;
            }
            
            .mobile-btn {
                padding: 15px;
                font-size: 1.5em;
            }
            
            .game-over {
                padding: 20px;
                min-width: 250px;
                width: 90%;
            }
            
            .game-over h2 {
                font-size: 2em;
            }
            
            .game-over p {
                font-size: 1.2em;
            }
            
            .instructions {
                font-size: 0.8em;
            }
            
            .top-ad, .bottom-ad {
                padding: 5px;
            }
            
            .horizontal-ad {
                min-height: 70px;
            }
        }
        
        @media (min-width: 901px) and (max-width: 1200px) {
            .sidebar-ad {
                width: 140px;
            }
            
            .ad-space {
                min-height: 500px;
            }
            
            canvas {
                max-width: 450px;
            }
        }
    </style>
</head>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOver">
        <h2>🎮 Game Over</h2>
        <p>نقاطك: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">🔄 لعب مرة أخرى</button>
    </div>

    <script>
        // ========== إعدادات اللعبة ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverDiv = document.getElementById('gameOver');
        const overlay = document.getElementById('overlay');
        const finalScoreElement = document.getElementById('finalScore');
        const pauseBtn = document.getElementById('pauseBtn');

        // ثوابت اللعبة
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const INITIAL_SPEED = 150;
        
        // متغيرات اللعبة
        let snake = [];
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = true;
        let gamePaused = false;
        let gameOverFlag = false;
        let speed = INITIAL_SPEED;
        let lastUpdate = 0;
        let gameLoopRunning = false;
        
        highScoreElement.textContent = highScore;

        // بدء اللعبة
        initGame();

        function initGame() {
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10},
                {x: 7, y: 10}
            ];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            gameRunning = true;
            gamePaused = false;
            gameOverFlag = false;
            speed = INITIAL_SPEED;
            scoreElement.textContent = score;
            pauseBtn.textContent = '⏸️ إيقاف';
            
            generateFood();
            draw();
            
            if (!gameLoopRunning) {
                gameLoopRunning = true;
                requestAnimationFrame(gameLoop);
            }
            
            // عرض إعلان بدء اللعبة
            showGameStartAd();
        }

        function generateFood() {
            let maxAttempts = 1000;
            let attempts = 0;
            
            do {
                food = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
                attempts++;
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y) && attempts < maxAttempts);
            
            if (attempts >= maxAttempts) {
                gameOver();
            }
        }

        function draw() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }
            
            snake.forEach((segment, index) => {
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;
                
                if (index === 0) {
                    ctx.fillStyle = '#00fff9';
                    ctx.shadowColor = '#00fff9';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(x + 2, y + 2, GRID_SIZE - 4, GRID_SIZE - 4);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 5;
                    
                    if (direction.x === 1) {
                        ctx.fillRect(x + 14, y + 5, 3, 3);
                        ctx.fillRect(x + 14, y + 12, 3, 3);
                    } else if (direction.x === -1) {
                        ctx.fillRect(x + 3, y + 5, 3, 3);
                        ctx.fillRect(x + 3, y + 12, 3, 3);
                    } else if (direction.y === -1) {
                        ctx.fillRect(x + 5, y + 3, 3, 3);
                        ctx.fillRect(x + 12, y + 3, 3, 3);
                    } else if (direction.y === 1) {
                        ctx.fillRect(x + 5, y + 14, 3, 3);
                        ctx.fillRect(x + 12, y + 14, 3, 3);
                    }
                } else {
                    const brightness = 100 - (index * 2);
                    ctx.fillStyle = `rgb(0, ${brightness}, ${brightness})`;
                    ctx.shadowColor = '#00fff9';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(x + 3, y + 3, GRID_SIZE - 6, GRID_SIZE - 6);
                }
            });
            
            ctx.fillStyle = '#ff3366';
            ctx.shadowColor = '#ff3366';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE/2,
                food.y * GRID_SIZE + GRID_SIZE/2,
                GRID_SIZE/2 - 3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE/2 - 3,
                food.y * GRID_SIZE + GRID_SIZE/2 - 3,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        function update() {
            if (!gameRunning || gamePaused || gameOverFlag) return;
            
            direction = {...nextDirection};
            
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }
            
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                generateFood();
                
                if (score % 30 === 0) {
                    speed = Math.max(70, speed - 5);
                }
                
                // عرض إعلان داخل اللعبة عند كل 50 نقطة
                if (score % 50 === 0) {
                    showInGameAd();
                }
            } else {
                snake.pop();
            }
        }

        function gameLoop(currentTime) {
            if (!gameRunning) return;
            
            if (currentTime - lastUpdate >= speed && !gamePaused && !gameOverFlag) {
                update();
                draw();
                lastUpdate = currentTime;
            }
            
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameOverFlag = true;
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverDiv.style.display = 'block';
            overlay.style.display = 'block';
        }

        function resetGame() {
            gameOverDiv.style.display = 'none';
            overlay.style.display = 'none';
            initGame();
        }

        function togglePause() {
            if (gameOverFlag) return;
            
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? '▶️ متابعة' : '⏸️ إيقاف';
        }

        function changeDirection(newDirection) {
            if (!gameRunning || gamePaused || gameOverFlag) return;
            
            const directions = {
                'up': {x: 0, y: -1},
                'down': {x: 0, y: 1},
                'left': {x: -1, y: 0},
                'right': {x: 1, y: 0}
            };
            
            const newDir = directions[newDirection];
            
            if ((direction.x === 0 && newDir.x === 0) || (direction.y === 0 && newDir.y === 0)) {
                return;
            }
            
            if ((direction.x === -newDir.x && direction.y === -newDir.y) ||
                (direction.y === -newDir.y && direction.x === -newDir.x)) {
                return;
            }
            
            nextDirection = newDir;
        }

        // ========== وظائف عرض الإعلانات ==========
        function showGameStartAd() {
            console.log('عرض إعلان بدء اللعبة');
            // يمكن إضافة منطق عرض الإعلان هنا
        }
        
        function showInGameAd() {
            console.log('عرض إعلان داخل اللعبة');
            // يمكن إضافة منطق عرض الإعلان هنا
        }

        // ========== التحكم بلوحة المفاتيح ==========
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || gamePaused || gameOverFlag) return;
            
            const keyDirections = {
                'ArrowUp': {x: 0, y: -1},
                'ArrowDown': {x: 0, y: 1},
                'ArrowLeft': {x: -1, y: 0},
                'ArrowRight': {x: 1, y: 0}
            };
            
            if (keyDirections[e.key]) {
                e.preventDefault();
                changeDirection(
                    e.key.replace('Arrow', '').toLowerCase()
                );
            } else if (e.key === ' ') {
                e.preventDefault();
                togglePause();
            } else if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        // ========== التحكم باللمس ==========
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: false});
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!touchStartX || !touchStartY) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20) {
                    changeDirection('right');
                } else if (diffX < -20) {
                    changeDirection('left');
                }
            } else {
                if (diffY > 20) {
                    changeDirection('down');
                } else if (diffY < -20) {
                    changeDirection('up');
                }
            }
            
            touchStartX = 0;
            touchStartY = 0;
        }, {passive: false});

        window.addEventListener('keydown', (e) => {
            if (e.key.startsWith('Arrow') || e.key === ' ') {
                e.preventDefault();
            }
        }, false);

        resetGame();
    </script>
</body>
