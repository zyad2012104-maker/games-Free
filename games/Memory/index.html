<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"> 
<title>لعبة الذاكرة - 1000 مستوى احترافي</title> 

<style> 
* { 
margin: 0; 
padding: 0; 
box-sizing: border-box; 
} 

body { 
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
min-height: 100vh; 
display: flex; 
justify-content: center; 
align-items: center; 
padding: 10px; 
} 

/* المحتوى الرئيسي */ 
.main-content { 
width: 100%; 
max-width: 1200px; 
} 

/* حاوية اللعبة */ 
.game-container { 
background: rgba(255, 255, 255, 0.95); 
border-radius: 20px; 
padding: 30px; 
box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
backdrop-filter: blur(10px); 
width: 100%; 
} 

/* تنسيقات اللعبة */ 
.header { 
text-align: center; 
margin-bottom: 30px; 
} 

h1 { 
color: #4a2b7c; 
font-size: 2.5em; 
margin-bottom: 20px; 
text-shadow: 2px 2px 4px rgba(0,0,0,0.1); 
} 

/* شريط التقدم والمستوى */ 
.level-progress { 
background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); 
color: white; 
padding: 20px; 
border-radius: 15px; 
margin-bottom: 20px; 
text-align: center; 
box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
} 

.level-info { 
display: flex; 
justify-content: space-between; 
align-items: center; 
margin-bottom: 15px; 
font-size: 1.2em; 
} 

.level-badge { 
background: white; 
color: #4a2b7c; 
padding: 8px 20px; 
border-radius: 50px; 
font-weight: bold; 
font-size: 1.3em; 
} 

.progress-bar { 
width: 100%; 
height: 20px; 
background: rgba(255,255,255,0.3); 
border-radius: 10px; 
overflow: hidden; 
margin: 10px 0; 
} 

.progress-fill { 
height: 100%; 
background: white; 
border-radius: 10px; 
transition: width 0.3s ease; 
width: 0%; 
} 

.next-level-info { 
font-size: 1.1em; 
margin-top: 10px; 
} 

.stats { 
display: flex; 
justify-content: space-around; 
flex-wrap: wrap; 
gap: 15px; 
margin-bottom: 20px; 
} 

.stat-box { 
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
color: white; 
padding: 15px 25px; 
border-radius: 15px; 
font-size: 1.2em; 
box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
min-width: 150px; 
flex: 1; 
} 

.stat-box span { 
display: block; 
font-size: 2em; 
font-weight: bold; 
margin-top: 5px; 
} 

.board { 
display: grid; 
gap: 15px; 
margin: 30px 0; 
} 

.card { 
aspect-ratio: 1; 
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
border-radius: 15px; 
cursor: pointer; 
display: flex; 
justify-content: center; 
align-items: center; 
font-size: 2.5em; 
color: white; 
transition: all 0.3s ease; 
box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
transform-style: preserve-3d; 
position: relative; 
} 

.card.flipped { 
background: white; 
color: #4a2b7c; 
transform: rotateY(180deg); 
box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
} 

.card.matched { 
background: #4CAF50; 
color: white; 
cursor: default; 
animation: pulse 0.5s ease; 
transform: rotateY(180deg); 
} 

.card.matched i { 
color: white; 
} 

.card:not(.flipped):not(.matched):hover { 
transform: scale(1.05); 
box-shadow: 0 15px 30px rgba(0,0,0,0.3); 
} 

@keyframes pulse { 
0%, 100% { transform: scale(1) rotateY(180deg); } 
50% { transform: scale(1.1) rotateY(180deg); } 
} 

.controls { 
display: flex; 
justify-content: center; 
gap: 15px; 
margin-top: 20px; 
} 

button { 
padding: 15px 30px; 
font-size: 1.1em; 
border: none; 
border-radius: 50px; 
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
color: white; 
cursor: pointer; 
transition: all 0.3s ease; 
font-weight: bold; 
box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
} 

button:hover { 
transform: translateY(-2px); 
box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
} 

button:active { 
transform: translateY(0); 
} 

button:disabled { 
opacity: 0.5; 
cursor: not-allowed; 
transform: none; 
} 

.message { 
text-align: center; 
margin-top: 20px; 
font-size: 1.4em; 
font-weight: bold; 
color: #4a2b7c; 
min-height: 60px; 
padding: 15px; 
background: rgba(255,255,255,0.9); 
border-radius: 15px; 
box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
} 

/* حاوية الإعلانات الجانبية */
.ad-container {
    display: flex;
    justify-content: center;
    margin: 10px 0;
    min-height: 620px;
    overflow: hidden;
}

/* ========== تنسيقات الموبيل ========== */ 
@media (max-width: 900px) { 
/* تصغير حجم الخط للعناوين */ 
h1 { 
font-size: 2em; 
margin-bottom: 15px; 
} 

/* تقليل المسافات الداخلية */ 
.game-container { 
padding: 15px; 
} 

/* تحسين شريط المستوى للموبيل */ 
.level-progress { 
padding: 15px; 
} 

.level-info { 
font-size: 1em; 
} 

.level-badge { 
font-size: 1.1em; 
padding: 5px 15px; 
} 

/* توزيع صناديق الإحصائيات بشكل أفضل */ 
.stats { 
gap: 10px; 
} 

.stat-box { 
padding: 10px; 
min-width: 80px; 
} 

.stat-box span { 
font-size: 1.3em; 
} 

/* تحسين شبكة البطاقات للموبيل */ 
.board { 
gap: 8px; 
margin: 20px 0; 
} 

.card { 
font-size: 1.8em; 
} 

/* تحسين الأزرار للموبيل */ 
.controls { 
flex-direction: column; 
gap: 10px; 
} 

button { 
width: 100%; 
padding: 12px; 
font-size: 1em; 
} 

/* تحسين صندوق الرسائل */ 
.message { 
font-size: 1.1em; 
padding: 12px; 
min-height: 50px; 
} 

/* تحسين الإعلانات للموبيل */
.ad-container {
    min-height: auto;
}
} 

/* تنسيقات للشاشات الصغيرة جداً */ 
@media (max-width: 400px) { 
.game-container { 
padding: 10px; 
} 

h1 { 
font-size: 1.5em; 
} 

.level-info { 
flex-direction: column; 
gap: 10px; 
} 

.level-badge { 
width: 100%; 
text-align: center; 
} 

.stat-box { 
font-size: 0.9em; 
} 

.card { 
font-size: 1.5em; 
} 
} 

/* تحسين شاشة اللمس */ 
@media (hover: none) { 
.card:not(.flipped):not(.matched):hover { 
transform: none; 
} 

button:hover { 
transform: none; 
} 
} 
</style>

<script>
class MemoryGame { 
constructor() { 
this.board = document.getElementById('board'); 
this.timerElement = document.getElementById('timer'); 
this.movesElement = document.getElementById('moves'); 
this.matchedElement = document.getElementById('matched'); 
this.messageElement = document.getElementById('message'); 
this.newGameBtn = document.getElementById('newGameBtn'); 
this.restartLevelBtn = document.getElementById('restartLevelBtn'); 

// عناصر المستوى 
this.currentLevelSpan = document.getElementById('currentLevel'); 
this.maxLevelSpan = document.getElementById('maxLevel'); 
this.levelNameSpan = document.getElementById('levelName'); 
this.progressFill = document.getElementById('progressFill'); 
this.nextLevelInfo = document.getElementById('nextLevelInfo'); 

// إنشاء 1000 مستوى مع زيادة مربعين كل مرة 
this.levels = []; 

// المستوى الأول: 4 مربعات (2×2) 
let totalCards = 4; 

for (let i = 1; i <= 1000; i++) { 
// حساب أبعاد مناسبة للشبكة 
let cols = Math.min(12, Math.ceil(Math.sqrt(totalCards))); 
let rows = Math.ceil(totalCards / cols); 

// ضبط الأبعاد لتناسب البطاقات بالضبط 
while (rows * cols < totalCards) { 
cols = Math.min(12, cols + 1); 
rows = Math.ceil(totalCards / cols); 
} 

// اسم المستوى 
let levelName = `مستوى ${i}`; 
if (i <= 10) levelName = `مستوى ${i} - مبتدئ`; 
else if (i <= 50) levelName = `مستوى ${i} - متوسط`; 
else if (i <= 200) levelName = `مستوى ${i} - متقدم`; 
else if (i <= 500) levelName = `مستوى ${i} - خبير`; 
else levelName = `مستوى ${i} - أسطوري`; 

// وقت إضافي حسب عدد البطاقات 
let timeBonus = 30 + Math.floor(totalCards * 1.5); 

this.levels.push({ 
name: levelName, 
cols: cols, 
rows: rows, 
totalCards: totalCards, 
timeBonus: timeBonus 
}); 

// زيادة مربعين لكل مستوى (لضمان العدد زوجي دائماً) 
totalCards += 2; 
} 

this.currentLevel = 0; // 0-based index 
this.maxLevel = this.levels.length; 
this.cards = []; 
this.flippedCards = []; 
this.matchedPairs = 0; 
this.moves = 0; 
this.timer = null; 
this.seconds = 0; 
this.canFlip = true; 
this.totalPairs = 0; 

// إحصائيات المستوى 
this.levelStats = { moves: 0, time: 0 }; 

this.icons = [ 
'fa-heart', 'fa-star', 'fa-moon', 'fa-sun', 'fa-cloud', 'fa-tree', 
'fa-car', 'fa-bicycle', 'fa-cat', 'fa-dog', 'fa-fish', 'fa-plane', 
'fa-rocket', 'fa-gem', 'fa-crown', 'fa-flag', 'fa-anchor', 'fa-bell', 
'fa-bolt', 'fa-bomb', 'fa-book', 'fa-bug', 'fa-camera', 'fa-clock', 
'fa-coffee', 'fa-dragon', 'fa-feather', 'fa-fire', 'fa-ghost', 'fa-gift', 
'fa-key', 'fa-leaf', 'fa-lightbulb', 'fa-lock', 'fa-magic', 'fa-music', 
'fa-pencil', 'fa-phone', 'fa-smile', 'fa-snowflake', 'fa-apple', 'fa-brain', 
'fa-code', 'fa-gamepad', 'fa-headphones', 'fa-motorcycle', 'fa-umbrella', 
'fa-volcano', 'fa-wifi', 'fa-trophy', 'fa-medal', 'fa-shield', 'fa-hat-wizard', 
'fa-dragon', 'fa-frog', 'fa-hippo', 'fa-kiwi-bird', 'fa-otter', 'fa-paw', 
'fa-spider', 'fa-dove', 'fa-crow' 
]; 

this.init(); 
} 

init() { 
this.setupEventListeners(); 
this.startNewGame(); 
} 

setupEventListeners() { 
this.newGameBtn.addEventListener('click', () => { 
this.currentLevel = 0; 
this.startNewGame(); 
}); 

this.restartLevelBtn.addEventListener('click', () => { 
this.restartLevel(); 
}); 
} 

startNewGame() { 
this.stopTimer(); 
this.seconds = 0; 
this.moves = 0; 
this.matchedPairs = 0; 
this.flippedCards = []; 
this.canFlip = true; 
this.updateUI(); 
this.createBoard(); 
this.startTimer(); 
this.updateMessage(`المستوى ${this.currentLevel + 1}: ${this.getCurrentLevel().name}`); 
} 

restartLevel() { 
this.stopTimer(); 
this.seconds = 0; 
this.moves = 0; 
this.matchedPairs = 0; 
this.flippedCards = []; 
this.canFlip = true; 
this.updateUI(); 
this.createBoard(); 
this.startTimer(); 
this.updateMessage(`إعادة المستوى ${this.currentLevel + 1}`); 
} 

getCurrentLevel() { 
return this.levels[this.currentLevel]; 
} 

updateUI() { 
const level = this.getCurrentLevel(); 
this.totalPairs = level.totalCards / 2; 

// تحديث عرض المستوى 
this.currentLevelSpan.textContent = this.currentLevel + 1; 
this.maxLevelSpan.textContent = this.maxLevel; 
this.levelNameSpan.textContent = level.name; 

// تحديث شريط التقدم 
const progress = (this.currentLevel / (this.maxLevel - 1)) * 100; 
this.progressFill.style.width = `${progress}%`; 

// تحديث معلومات المستوى التالي 
if (this.currentLevel < this.maxLevel - 1) { 
this.nextLevelInfo.textContent = `المستوى التالي: ${this.levels[this.currentLevel + 1].name}`; 
} else { 
this.nextLevelInfo.textContent = '🏆 المستوى النهائي!'; 
} 

this.updateMatchedDisplay(); 
this.updateTimerDisplay(); 
this.updateMovesDisplay(); 
} 

createBoard() { 
const level = this.getCurrentLevel(); 
const totalCards = level.totalCards; 
const pairCount = totalCards / 2; 

// اختيار الأيقونات المطلوبة 
const selectedIcons = []; 
for (let i = 0; i < pairCount; i++) { 
selectedIcons.push(this.icons[i % this.icons.length]); 
} 

// تكرار كل أيقونة مرتين 
let cardIcons = [...selectedIcons, ...selectedIcons]; 

// خلط البطاقات 
cardIcons = this.shuffleArray(cardIcons); 

// إنشاء مصفوفة البطاقات 
this.cards = cardIcons.map((icon, index) => ({ 
id: index, 
icon: icon, 
isFlipped: false, 
isMatched: false 
})); 

this.renderBoard(level.cols); 
} 

renderBoard(cols) { 
this.board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; 
this.board.innerHTML = ''; 

this.cards.forEach((card, index) => { 
const cardElement = document.createElement('div'); 
cardElement.className = 'card'; 
cardElement.dataset.index = index; 

const iconElement = document.createElement('i'); 
iconElement.className = `fas ${card.icon}`; 
cardElement.appendChild(iconElement); 

cardElement.addEventListener('click', () => this.handleCardClick(index)); 
this.board.appendChild(cardElement); 
}); 
} 

handleCardClick(index) { 
if (!this.canFlip) return; 

const card = this.cards[index]; 
const cardElement = this.board.children[index]; 

if (card.isMatched || card.isFlipped) return; 
if (this.flippedCards.length >= 2) return; 

// قلب البطاقة 
card.isFlipped = true; 
cardElement.classList.add('flipped'); 
this.flippedCards.push({ index, card, element: cardElement }); 

if (this.flippedCards.length === 2) { 
this.moves++; 
this.updateMovesDisplay(); 
this.checkMatch(); 
} 
} 

checkMatch() { 
const [card1, card2] = this.flippedCards; 

if (card1.card.icon === card2.card.icon) { 
// تطابق 
setTimeout(() => { 
card1.card.isMatched = true; 
card2.card.isMatched = true; 
card1.element.classList.remove('flipped'); 
card2.element.classList.remove('flipped'); 
card1.element.classList.add('matched'); 
card2.element.classList.add('matched'); 

this.matchedPairs++; 
this.updateMatchedDisplay(); 
this.flippedCards = []; 

if (this.matchedPairs === this.totalPairs) { 
this.levelComplete(); 
} 
}, 500); 
} else { 
// غير متطابقين 
this.canFlip = false; 
setTimeout(() => { 
card1.card.isFlipped = false; 
card2.card.isFlipped = false; 
card1.element.classList.remove('flipped'); 
card2.element.classList.remove('flipped'); 
this.flippedCards = []; 
this.canFlip = true; 
}, 1000); 
} 
} 

levelComplete() { 
this.stopTimer(); 

// حفظ إحصائيات المستوى 
this.levelStats.moves = this.moves; 
this.levelStats.time = this.seconds; 

if (this.currentLevel < this.maxLevel - 1) { 
// الانتقال للمستوى التالي 
this.currentLevel++; 

// رسالة احتفالية 
this.updateMessage(`🎉 مستوى رائع! انتقلت إلى المستوى ${this.currentLevel + 1}: ${this.getCurrentLevel().name} 🎉`); 

// تأثير احتفالي 
if (typeof confetti === 'function') { 
confetti({ 
particleCount: 100, 
spread: 70, 
origin: { y: 0.6 } 
}); 
} 

// تأخير قبل بدء المستوى الجديد 
setTimeout(() => { 
this.startNewGame(); 
}, 3000); 
} else { 
// الفوز باللعبة كاملة 
this.gameComplete(); 
} 
} 

gameComplete() { 
this.updateMessage(` 
🏆 تهانينا! لقد أكملت جميع المستويات الـ 1000! 🏆<br> 
إجمالي الحركات: ${this.moves} | الوقت: ${this.formatTime(this.seconds)} 
`); 

// احتفال كبير 
if (typeof confetti === 'function') { 
for (let i = 0; i < 10; i++) { 
setTimeout(() => { 
confetti({ 
particleCount: 200, 
spread: 100, 
origin: { y: 0.6 } 
}); 
}, i * 200); 
} 
} 
} 

shuffleArray(array) { 
for (let i = array.length - 1; i > 0; i--) { 
const j = Math.floor(Math.random() * (i + 1)); 
[array[i], array[j]] = [array[j], array[i]]; 
} 
return array; 
} 

startTimer() { 
this.timer = setInterval(() => { 
this.seconds++; 
this.updateTimerDisplay(); 
}, 1000); 
} 

stopTimer() { 
if (this.timer) { 
clearInterval(this.timer); 
this.timer = null; 
} 
} 

updateTimerDisplay() { 
this.timerElement.textContent = this.formatTime(this.seconds); 
} 

formatTime(seconds) { 
const mins = Math.floor(seconds / 60); 
const secs = seconds % 60; 
return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`; 
} 

updateMovesDisplay() { 
this.movesElement.textContent = this.moves; 
} 

updateMatchedDisplay() { 
this.matchedElement.textContent = `${this.matchedPairs}/${this.totalPairs}`; 
} 

updateMessage(text) { 
this.messageElement.innerHTML = text; 
} 
} 

// بدء اللعبة - نضمن تحميل DOM أولاً
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        new MemoryGame();
    });
} else {
    // DOM جاهز بالفعل
    new MemoryGame();
}
