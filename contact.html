<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - ألعاب عربي</title>
    <style>
        .contact-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
        }
        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }
        .contact-card {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .contact-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .contact-form {
            max-width: 600px;
            margin: 40px auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff9800;
        }
        .submit-btn {
            background: #ff9800;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>...</header>
    
    <div class="container">
        <div class="stats-bar">...</div>
        
        <div class="contact-content">
            <h1>اتصل بنا</h1>
            <p>نحن هنا للإجابة على استفساراتك ومساعدتك. اختر الطريقة المناسبة للتواصل معنا.</p>
            
            <div class="contact-info">
                <div class="contact-card">
                    <div class="contact-icon">📧</div>
                    <h3>البريد الإلكتروني</h3>
                    <p style="color: #ff9800;">zyad2012104@gmail.com</p>
                </div>
                <div class="contact-card">
                    <div class="contact-icon">💬</div>
                    <h3>الدردشة المباشرة</h3>
                    <p>متاح من 9 صباحاً - 5 مساءً</p>
                </div>
                <div class="contact-card">
                    <div class="contact-icon">📱</div>
                    <h3>وسائل التواصل</h3>
                    <p>فيسبوك - تويتر - انستغرام</p>
                </div>
            </div>
            
            <h2 style="text-align: center; margin: 40px 0 20px;">أو أرسل لنا رسالة مباشرة</h2>
            
            <form class="contact-form">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>الموضوع</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>الرسالة</label>
                    <textarea rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">إرسال الرسالة</button>
            </form>
        </div>
    </div>
    
    <footer>...</footer>
</body>
</html>
